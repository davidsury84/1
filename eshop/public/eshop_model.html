<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drátový model e-shopu — ELKOPLAST</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#151a22; --bg3:#1c232d; --line:#2a333f; --line2:#384455;
    --tx:#dfe6ef; --tx2:#9aa7b8; --tx3:#65727f;
    --acc:#39d3b4; --acc2:#1a9d86; --warn:#f0a93b; --bad:#e8604c; --ok:#7bd06b;
    --front:#3a86c8; --core:#39d3b4; --supply:#f0a93b; --fulfil:#7bd06b; --integ:#b48ee8; --logic:#d97757; --screen:#9aa7b8;
    --erp:#f2c14e;   /* Helios — ERP jádro modelu */
    --e-data:#3a86c8; --e-goods:#f0a93b; --e-money:#7bd06b; --e-event:#b48ee8; --e-nav:#9aa7b8;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13px;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{display:flex;align-items:center;gap:12px;padding:6px 14px;min-height:56px;flex-shrink:0;flex-wrap:wrap;
    background:var(--bg2);border-bottom:1px solid var(--line)}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:14px;font-weight:600;letter-spacing:.2px}
  .brand span{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.5px}
  .tools{display:flex;gap:6px;margin-left:4px;flex-wrap:wrap}
  button.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--line2);border-radius:7px;
    padding:6px 9px;font-size:12px;cursor:pointer;font-family:var(--sans);transition:.12s;white-space:nowrap}
  header .tools .btn{padding:6px 8px;font-size:11.5px}
  @media (max-width:1400px){.brand span{display:none}}
  button.btn:hover{border-color:var(--acc);color:#fff}
  button.run{background:var(--acc2);border-color:var(--acc);color:#04201b;font-weight:600}
  button.run:hover{background:var(--acc);color:#04201b}
  button.btn.danger{border-color:var(--bad);color:var(--bad)}
  button.btn.danger:hover{background:var(--bad);color:#fff}
  .yield{margin-left:auto;display:flex;gap:16px;align-items:center;padding-right:14px}
  .yield .kpi{text-align:right;line-height:1.05}
  .yield .kpi b{font-family:var(--mono);font-size:15px;display:block}
  .yield .kpi span{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}

  .tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex-shrink:0;height:36px}
  .tab{background:transparent;border:0;color:var(--tx2);padding:0 20px;cursor:pointer;font-family:var(--sans);
    font-size:12.5px;font-weight:500;border-right:1px solid var(--line);display:flex;align-items:center;gap:7px;transition:all .15s}
  .tab:hover{color:var(--tx);background:var(--bg3)}
  .tab.on{background:var(--bg);color:var(--tx);border-bottom:2px solid var(--acc);margin-bottom:-1px}
  .tab .pill{background:var(--bg3);color:var(--tx2);font-size:10px;padding:1px 6px;border-radius:4px;font-family:var(--mono)}
  .tab.on .pill{background:var(--acc);color:#04201b}
  .pageWrap{flex:1;overflow:hidden;position:relative}
  .page{position:absolute;inset:0;display:none;overflow:hidden}
  .page.on{display:block}
  #pgCanvas.on{display:grid;grid-template-columns:212px 1fr 326px}
  /* celá plocha: boční panely zmizí a v případě potřeby se vysunou přes plátno */
  body.panels-off #pgCanvas.on{grid-template-columns:1fr}
  body.panels-off aside.palette,body.panels-off aside.insp{position:absolute;top:0;bottom:0;z-index:9;display:none;box-shadow:0 0 34px rgba(0,0,0,.55)}
  body.panels-off aside.palette{left:0;width:212px}
  body.panels-off aside.insp{right:0;width:326px}
  body.panels-off.pal-open aside.palette{display:block}
  body.panels-off.has-sel aside.insp{display:block}
  .fab{display:none;position:absolute;left:14px;top:12px;z-index:8;font:600 11px/1 var(--sans);color:var(--tx2);
    background:var(--bg2);border:1px solid var(--line);padding:7px 11px;border-radius:20px;cursor:pointer}
  .fab:hover{color:var(--tx);border-color:var(--line2)}
  body.panels-off .fab{display:block}
  #pgProcess.on,#pgHelp.on{display:flex;flex-direction:column;overflow:auto;padding:20px 28px}

  /* palette */
  aside.palette{background:var(--bg2);border-right:1px solid var(--line);overflow:auto;padding:12px 10px}
  .pgroup{font-size:9.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.4px;margin:14px 4px 7px}
  .pgroup:first-child{margin-top:2px}
  .pitem{display:flex;align-items:center;gap:9px;background:var(--bg3);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:.12s;user-select:none}
  .pitem:hover{border-color:var(--acc);transform:translateX(2px)}
  .pitem b{font-size:12px}
  .pdot{width:9px;height:9px;border-radius:3px;flex:none}
  .pitem small{display:block;color:var(--tx3);font-size:10.5px}

  /* canvas */
  .canvas{position:relative;overflow:hidden;background:
    radial-gradient(circle at 1px 1px,#222b35 1px,transparent 0) 0 0/22px 22px,var(--bg)}
  .viewport{position:absolute;left:0;top:0;transform-origin:0 0}
  svg.edges{position:absolute;left:0;top:0;width:6000px;height:4000px;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:var(--line2);stroke-width:2;pointer-events:stroke;cursor:pointer}
  .edge.t-data{stroke:var(--e-data)}.edge.t-goods{stroke:var(--e-goods)}.edge.t-money{stroke:var(--e-money)}
  .edge.t-event{stroke:var(--e-event);stroke-dasharray:6 5}.edge.t-nav{stroke:var(--e-nav)}
  .edge.sel{stroke:#fff;stroke-width:3}
  .edgehit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
  .flow{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:2 14;opacity:.55;pointer-events:none;animation:flowmove 1.6s linear infinite}
  @keyframes flowmove{to{stroke-dashoffset:-16}}
  .zone{fill-opacity:.045;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:8 6;rx:14}
  .zlbl{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;fill-opacity:.55;pointer-events:none}
  .elbl{font-family:var(--sans);font-size:10px;fill:var(--tx2);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
  .elbl.sel{fill:#fff;font-weight:600}
  .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:calc(100% - 240px);overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--tx3);z-index:5;
    background:var(--bg2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;pointer-events:none;white-space:nowrap}
  /* přepínač vrstev — model jde číst po jedné oblasti, ne všechno naráz */
  .layers{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:6;display:flex;gap:6px;
    flex-wrap:wrap;justify-content:center;max-width:calc(100% - 28px)}
  .layers .lb{font:600 11px/1 var(--sans);color:var(--tx2);background:var(--bg2);border:1px solid var(--line);
    padding:7px 11px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .layers .lb:hover{color:var(--tx);border-color:var(--line2)}
  .layers .lb.on{background:var(--bg3,var(--bg2));box-shadow:0 0 0 1px currentColor inset}
  .layers .lb .d{width:8px;height:8px;border-radius:2px;flex:none}
  .layers .lb .c{color:var(--tx3);font-weight:500}
  .edge.stub{stroke-dasharray:4 4;opacity:.85}
  .elbl.go{pointer-events:auto;cursor:pointer}
  .elbl.go:hover{fill:#fff;text-decoration:underline}
  .zlbl.go{pointer-events:auto;cursor:pointer}
  .zlbl.go:hover{fill-opacity:.95}
  @keyframes nflash{0%{box-shadow:0 0 0 3px var(--acc)}70%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 2px 0 rgba(0,0,0,.25)}}
  .node.flash{animation:nflash 1.2s ease-out}
  .stubdot{fill:var(--tx3)}
  .elbl.stub{fill:var(--tx3);font-weight:600}
  .elbl.stub.s{text-anchor:start}
  .elbl.stub.e{text-anchor:end}
  .legend{position:absolute;left:14px;bottom:14px;z-index:5;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:9px 12px;font-size:10.5px;color:var(--tx2);display:grid;gap:4px;min-width:170px}
  .legend b{color:var(--tx3);font-size:9.5px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
  .legend .li{display:flex;align-items:center;gap:7px}
  .legend .sw{width:22px;height:0;border-top:2px solid;flex:none}
  .legend .sw.ev{border-top-style:dashed}

  .node{position:absolute;width:220px;background:var(--bg2);border:1px solid var(--line2);
    border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.25);user-select:none}
  .node.sel{border-color:#fff;box-shadow:0 0 0 1px #fff}
  .node.a-manual{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),0 0 18px rgba(232,96,76,.35)}
  .node.a-semi{box-shadow:0 0 0 1px var(--warn)}
  .node.sink{opacity:.9}
  .node .hd{display:flex;align-items:center;gap:7px;padding:7px 10px;cursor:grab;
    border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;font-weight:600;font-size:12px}
  .node .hd .cdot{width:8px;height:8px;border-radius:2px;flex:none}
  .node .hd .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .node .sub{height:18px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:10px;
    color:var(--tx3);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02);white-space:nowrap;overflow:hidden}
  .node .sub .mf{color:var(--tx2);font-weight:600;letter-spacing:.3px;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
  .node .sub .dot{color:var(--line2)}
  .abadge{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px;flex:none}
  .abadge.auto{background:rgba(57,211,180,.15);color:var(--acc)}
  .abadge.semi{background:rgba(240,169,59,.18);color:var(--warn)}
  .abadge.manual{background:rgba(232,96,76,.2);color:var(--bad)}
  .node .bd{position:relative;padding:6px 0 8px}
  .prow{height:24px;display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 14px}
  .plabel{font-size:10.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plabel.o{margin-left:auto;text-align:right}
  .port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--bg3);
    border:2px solid var(--line2);cursor:crosshair;top:50%;transform:translateY(-50%)}
  .port:hover{border-color:var(--acc);background:var(--acc)}
  .port.pin{left:-7px}.port.pout{right:-7px}
  .node .note{font-size:10px;color:var(--tx3);padding:0 10px 6px;line-height:1.35;white-space:pre-wrap}

  /* mini-wireframe uvnitř uzlu obrazovky */
  .wire{margin:8px 10px 2px;background:#f2f4f7;border-radius:5px;padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
  .wire .wb{display:flex;gap:3px;flex:none}
  .wire .bx{background:#c9d0da;border-radius:2px;flex:1}
  .wire .bx.dk{background:#9aa5b5}
  .wire .bx.ac{background:#39b394}
  .wire .bx.ln{background:#dde2e9;border:1px solid #c9d0da}
  .wire .bx.w1{flex:0 0 22%}.wire .bx.w2{flex:0 0 40%}
  .wire .wb.col{flex-direction:column;gap:2px}.wire .wb.col .bx{flex:none}
  .wire .cap{font-size:8px;color:#6c7684;line-height:1;margin-top:-1px}

  /* inspector */
  aside.insp{background:var(--bg2);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
  .ititle{font-size:13px;font-weight:600;margin:2px 0 3px}
  .isub{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
  .empty{color:var(--tx2);font-size:12px;line-height:1.6}
  .empty b{color:var(--tx)}
  label.f{display:block;margin-bottom:10px}
  label.f span{display:block;font-size:11px;color:var(--tx2);margin-bottom:4px}
  input.in,select.in,textarea.in{width:100%;background:var(--bg);border:1px solid var(--line2);color:var(--tx);
    border-radius:6px;padding:7px 8px;font-size:12px;font-family:var(--sans)}
  textarea.in{min-height:64px;resize:vertical;line-height:1.4}
  input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--acc)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--line2);
    color:var(--tx2);cursor:pointer;background:var(--bg);user-select:none}
  .chip.on{background:var(--acc2);border-color:var(--acc);color:#04201b}
  .chip.manual.on{background:var(--bad);border-color:var(--bad);color:#fff}
  .chip.semi.on{background:var(--warn);border-color:var(--warn);color:#0b0d12}
  .linkrow{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);padding:4px 0;border-bottom:1px dashed var(--line);cursor:pointer}
  .linkrow:hover{color:var(--tx)}
  .linkrow .go{cursor:pointer;font-weight:600;color:var(--tx)}
  .linkrow .go:hover{color:var(--acc);text-decoration:underline}
  .linkrow .ilink{margin-left:auto;padding-left:8px;color:var(--tx3);cursor:pointer}
  .linkrow .ilink:hover{color:var(--tx)}
  .linkrow .sw{width:14px;border-top:2px solid;flex:none}
  .irow{display:flex;gap:6px;margin-top:12px}
  .irow .btn{flex:1}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11.5px;color:var(--tx2);line-height:1.5;margin-bottom:10px}
  .card b{color:var(--tx)}

  /* procesy */
  .pgHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .pgHead h2{margin:0;font-size:18px;font-weight:600}
  .pgHead .sub{color:var(--tx2);font-size:12px;margin-top:3px}
  .pgHead .ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .sumBar{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px;max-width:1100px}
  .sumBox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .sumBox b{font-family:var(--mono);font-size:22px;display:block}
  .sumBox span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px}
  .bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:8px;display:flex}
  .bar i{display:block;height:100%}
  .flowTabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .flowTabs button{background:var(--bg3);border:1px solid var(--line);color:var(--tx2);border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:var(--sans)}
  .flowTabs button.on{border-color:var(--acc);color:#fff;background:var(--bg)}
  table.proc{width:100%;border-collapse:collapse;max-width:1400px}
  table.proc th{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);font-weight:600}
  table.proc td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  table.proc input,table.proc select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:5px;padding:5px 7px;font-size:12px;font-family:var(--sans)}
  table.proc input:focus,table.proc select:focus{outline:none;border-color:var(--acc)}
  table.proc select.manual{color:var(--bad);border-color:rgba(232,96,76,.5)}
  table.proc select.semi{color:var(--warn)}
  table.proc select.auto{color:var(--acc)}
  table.proc .num{font-family:var(--mono);color:var(--tx3);font-size:11px;width:30px}
  table.proc .del{background:transparent;border:1px solid var(--line2);color:var(--tx3);border-radius:5px;cursor:pointer;padding:3px 7px;font-size:11px}
  table.proc .del:hover{border-color:var(--bad);color:var(--bad)}
  .ftag{font-size:10px;padding:2px 7px;border-radius:5px;font-family:var(--mono);white-space:nowrap}
  .ftag.common{background:rgba(57,211,180,.15);color:var(--acc)}
  .ftag.stock{background:rgba(240,169,59,.18);color:var(--warn)}
  .ftag.own{background:rgba(58,134,200,.2);color:#7fb3e6}
  .ftag.drop{background:rgba(180,142,232,.2);color:var(--integ)}

  /* nápověda */
  .helpGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:1300px}
  .helpBox{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:12.5px;line-height:1.6;color:var(--tx2)}
  .helpBox h3{margin:0 0 8px;font-size:13.5px;color:var(--tx);display:flex;align-items:center;gap:8px}
  .helpBox ul,.helpBox ol{margin:6px 0 0;padding-left:18px}
  .helpBox li{margin-bottom:3px}
  .helpBox code{font-family:var(--mono);font-size:11px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--tx)}

  .cloudChip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx2);padding:6px 10px;border:1px solid var(--line);border-radius:8px;
    max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--bg3);margin-left:auto}
  .cloudChip:hover{border-color:var(--acc)}
  .cloudChip .st{font-family:var(--mono);font-size:10px}
  .cloudChip .st.ok{color:var(--acc)}.cloudChip .st.dirty{color:var(--warn)}.cloudChip .st.off{color:var(--tx3)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40}
  .modal.show{display:flex}
  .mbox{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;width:min(760px,94vw);max-height:88vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}
  .mhead h3{margin:0;font-size:15px}
  .mhead .x{background:transparent;border:0;color:var(--tx3);font-size:20px;cursor:pointer}
  .msub{font-size:11.5px;color:var(--tx2);margin-bottom:12px;line-height:1.5}
  .mrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .mrow.cur{background:rgba(57,211,180,.06);margin:0 -8px;padding:9px 8px;border-radius:6px}
  .mrow b{font-size:13px}.mrow small{display:block;color:var(--tx3);font-size:11px;margin-top:2px}
  .mrow .acts{display:flex;gap:6px}
  .mform{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .mform input.in{flex:1;min-width:200px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--acc);color:var(--tx);
    padding:9px 16px;border-radius:9px;font-size:12px;z-index:50;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><b>Drátový model e-shopu</b><span>ELKOPLAST · shop.elkoplast.cz · logika &amp; vazby</span></div>
    <div class="tools">
      <button class="btn run" onclick="autoLayoutCheck()">✔ Zkontrolovat model</button>
      <button class="btn" onclick="saveProj()">Uložit JSON</button>
      <button class="btn" onclick="document.getElementById('loadf').click()">Načíst JSON</button>
      <button class="btn" onclick="openShared()">☁ Sdílené modely</button>
      <button class="btn" onclick="fitView()" title="Zarovnat pohled na celý model">⤢ Zarovnat</button>
      <button class="btn" id="btnPanels" onclick="togglePanels()" title="Skrýt boční panely a využít celou plochu (paleta i inspektor se vysunou, když je potřebuješ)">⛶ Celá plocha</button>
      <button class="btn" onclick="resetDefault()">Výchozí model</button>
      <button class="btn danger" onclick="clearCanvas()">Vyčistit</button>
      <input id="loadf" type="file" accept=".json" style="display:none" onchange="loadProj(this.files[0])">
    </div>
    <div class="cloudChip" id="cloudChip" onclick="openShared()" title="Sdílený model na serveru"></div>
  </header>

  <nav class="tabs">

  erp:{label:"Helios — ERP (jádro)",cat:"erp",desc:"kmen produktů, zásoby, nákup, výroba, doklady, účetnictví",

          ["mo","výrobní zakázka"],["pick","výdejka / pick-list"],["doc","faktura a doklady"],["bi","data pro BI"],["sync","synchronizace"]],

/* ============ STAV ============ */
let state=null, dg="logic", sel=null, uid=1, currentPage="logic";
let pans={logic:{x:30,y:20,z:0.8},screens:{x:30,y:30,z:0.85}};

function nodeDefaults(type){const T=TYPES[type];return {system:"",auto:T.auto,owner:"",api:T.cat==="screen"?"":"REST API",sla:"",note:"",url:"",blocks:[]};}
function newNode(type,x,y){const T=TYPES[type];return {id:"n"+(uid++),type,name:T.label,x,y,params:nodeDefaults(type)};}
function newEdge(from,fp,to,tp,extra){return Object.assign({id:"e"+(uid++),from,fp,to,tp,label:"",etype:dg==="screens"?"nav":"data",trigger:TRIGGERS[0],payload:"",note:""},extra||{});}

/* ============ VÝCHOZÍ MODEL — LOGIKA ============ */
function buildDefaultLogic(){
  const nodes=[],edges=[];
  const N=(t,x,y,name,p)=>{const n=newNode(t,x,y);if(name)n.name=name;if(p)Object.assign(n.params,p);nodes.push(n);return n;};
  const E=(a,ap,b,bi,label,etype,extra)=>{edges.push(Object.assign(newEdge(a.id,ap,b.id,"in"+bi),{label,etype:etype||"data"},extra||{}));};
  // sloupce: vlevo e-shop, uprostřed Helios (ERP jádro), vpravo zboží
  const A=20,B=360,C=700,D_=1040,E_=1380,F=1720, HX=2140, G=2580,H=2920,I=3260;

  /* ---- ERP jádro: všechno podstatné prochází Heliosem ---- */
  const helios=N("erp",HX,455,"Helios — ERP (jádro)",{system:"Helios",api:"Databáze / sync",

  /* ---- data pro web (odvozená z Heliosu) ---- */

  /* ---- cesta zákazníka ---- */

  const account=N("account",B,760,"Účet / B2B portál",{system:"nový e-shop",note:"individuální ceníky z Heliosu, hromadná objednávka, faktury, opakovaný nákup"});
  const cart=N("cart",C,400,"Košík & checkout",{note:"1 krok; doprava a platba dle složení košíku (více zdrojů = více zásilek)"});
  const pay=N("payment",D_,400,"Platební brána",{system:"Comgate / GoPay",api:"Webhook",note:"B2B: platba fakturou se splatností; úhrady se párují v Heliosu"});
  const oms=N("oms",E_,400,"OMS – řízení objednávek",{system:"e-shop ↔ Helios",note:"stavy a rozpad na dílčí zásilky; do Heliosu jde objednávka datově, nikdo nic nepřepisuje"});

  const invoicing=N("invoicing",D_,760,"Fakturace & doklady",{system:"Helios",note:"faktura při expedici, dobropis při vratce — vystavuje Helios"});
  const notify=N("notify",C,760,"Notifikace zákazníka",{system:"e-mail / SMS",note:"přijato · zaplaceno · ve výrobě · expedováno · doručeno"});

  const crm=N("crm",C,1030,"CRM & marketing automat",{system:"e-mailing / CRM"});

  /* ---- interní nástroje nad e-shopem a Heliosem ---- */

    note:"Google SSO, moduly a přístupy; e-shop sem posílá prodeje, Helios exporty dokladů, zákazník reklamace"});

    note:"min/max a návrh objednávek, cenový model a přecenění, požadavky nákupu; běží v intranetu přes SSO"});

  /* ---- tři zdroje zboží ---- */

  const purchasing=N("purchasing",H,80,"Nákup na sklad",{system:"Helios (nákup)",note:"auto-PO při poklesu pod minimum + prognóza"});
  const supplier=N("supplier",I,80,"Dodavatel (na sklad)",{api:"E-mail (automat)"});

  const shipping=N("shipping",H,430,"Expedice & dopravci",{system:"Balíkobot / API dopravců",api:"REST API",note:"štítek + svoz bez lidského zásahu"});

/* ============ GEOMETRIE UZLŮ ============ */
const W=220,HDH=30,Y0=6,PR=24,SUBH=19;
const BLOCK_H={hdr:8,hero:18,grid:18,filters:14,gallery:22,avail:8,cta:9,list:16,form:14,summary:14,steps:8,table:16,tabs:8,config:20,map:16,footer:6};
function nodeRows(n){const T=TYPES[n.type];return Math.max(T.ins.length,T.outs.length,1);}
function hasSub(n){return true;}
function wireH(n){if(!TYPES[n.type].wire)return 0;const b=n.params.blocks||[];if(!b.length)return 0;
  return 8+12+2+b.reduce((s,k)=>s+(BLOCK_H[k]||10),0)+(b.length-1)*3;}
function hdOff(n){return HDH+SUBH+wireH(n);}
function nodeH(n){return hdOff(n)+Y0+nodeRows(n)*PR+10;}
function inPort(n,i){return {x:n.x,y:n.y+hdOff(n)+Y0+i*PR+PR/2};}
function outPort(n,j){return {x:n.x+W,y:n.y+hdOff(n)+Y0+j*PR+PR/2};}

/* ============ RENDER ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function wireHTML(n){const b=n.params.blocks||[];if(!b.length)return "";
  const bx=(cls,h)=>`<span class="bx ${cls||""}" style="height:${h}px"></span>`;
  const rows=b.map(k=>{const h=BLOCK_H[k]||10;switch(k){
    case "hdr":return `<div class="wb">${bx("dk w1",h)}${bx("",h)}${bx("w1",h)}</div>`;
    case "hero":return `<div class="wb">${bx("dk",h)}</div>`;
    case "grid":return `<div class="wb col"><span class="wb">${bx("",8)}${bx("",8)}${bx("",8)}</span><span class="wb">${bx("",8)}${bx("",8)}${bx("",8)}</span></div>`;
    case "filters":return `<div class="wb">${bx("dk w1",h)}${bx("ln",h)}</div>`;
    case "gallery":return `<div class="wb">${bx("dk w2",h)}${bx("ln",h)}</div>`;
    case "avail":return `<div class="wb">${bx("ac w2",h)}<span class="cap" style="align-self:center">termín dodání</span></div>`;
    case "cta":return `<div class="wb"><span style="flex:1"></span>${bx("ac w2",h)}</div>`;
    case "list":return `<div class="wb col">${bx("ln",4)}${bx("ln",4)}${bx("ln",4)}</div>`;
    case "form":return `<div class="wb col">${bx("ln",6)}${bx("ln",6)}</div>`;
    case "summary":return `<div class="wb">${bx("ln",h)}${bx("dk w1",h)}</div>`;
    case "steps":return `<div class="wb">${bx("ac",h)}${bx("",h)}${bx("",h)}</div>`;
    case "table":return `<div class="wb col">${bx("dk",4)}${bx("ln",4)}${bx("ln",4)}</div>`;
    case "tabs":return `<div class="wb">${bx("dk w1",h)}${bx("ln w1",h)}${bx("ln w1",h)}<span style="flex:1"></span></div>`;
    case "config":return `<div class="wb">${bx("ln w2",h)}<span class="wb col" style="flex:1">${bx("ln",5)}${bx("ln",5)}${bx("ac",5)}</span></div>`;
    case "map":return `<div class="wb">${bx("dk",h)}</div>`;
    case "footer":return `<div class="wb">${bx("",h)}${bx("",h)}${bx("",h)}</div>`;
    default:return `<div class="wb">${bx("",h)}</div>`;}}).join("");
  return `<div class="wire">${rows}</div>`;
}
/* ============ VRSTVY ============
   Vrstva = oblast (zóna) modelu. Blok patří do té oblasti, uvnitř které leží jeho střed,
   takže se vrstva odvozuje z plátna a drží se i u bloků, které si někdo přidá sám.
   Filtr schová ostatní vrstvy a vazby ven z vrstvy naznačí pahýlem s názvem protějšku. */
let layerSel={logic:null,screens:null};
function curLayer(){return layerSel[dg];}
function zoneShort(z){if(!z)return "";
  if(z.short)return z.short;
  const t=String(z.label||"").split(" — ")[0];
  return t.length>26?t.slice(0,25).trim()+"…":t;}
function nodeLayer(n,d){d=d||D();const zs=d.zones||[];
  const cx=n.x+W/2, cy=n.y+nodeH(n)/2;
  for(let i=0;i<zs.length;i++){const z=zs[i];if(cx>=z.x&&cx<=z.x+z.w&&cy>=z.y&&cy<=z.y+z.h)return i;}
  return -1;}
function layerVisible(n,d){const L=curLayer();if(L==null)return true;
  if(typeof drag!=="undefined"&&drag&&drag.id===n.id)return true;   // tažený blok nesmí zmizet pod rukou
  return nodeLayer(n,d)===L;}
function visNodes(d){d=d||D();return d.nodes.filter(n=>layerVisible(n,d));}
/* ============ CELÁ PLOCHA ============
   Boční panely se schovají; paleta se vysune tlačítkem, inspektor sám, když je něco vybrané. */
let panelsOff=true;
function applyPanels(){
  document.body.classList.toggle("panels-off",panelsOff);
  const b=document.getElementById("btnPanels");
  if(b){b.textContent=panelsOff?"▤ Panely":"⛶ Celá plocha";b.title=panelsOff?"Vrátit boční panely":"Skrýt boční panely a využít celou plochu";}
  try{localStorage.setItem("em_panels",panelsOff?"1":"0")}catch(e){}
  requestAnimationFrame(()=>renderEdges());
}
function togglePanels(){panelsOff=!panelsOff;if(!panelsOff)document.body.classList.remove("pal-open");applyPanels();}
function togglePal(){document.body.classList.toggle("pal-open");}

/* ============ PROKLIK ============
   Klik na text vazby (i na pahýl do jiné vrstvy) přenese pohled na protější blok:
   když leží v jiné vrstvě, přepne se vrstva, blok se vycentruje, vybere a zabliká. */
function centerOn(n){const r=canvas.getBoundingClientRect(),p=pan();
  p.x=r.width/2-(n.x+W/2)*p.z;p.y=r.height/2-(n.y+nodeH(n)/2)*p.z;applyPan();}
function flashNode(id){const el=document.querySelector('.node[data-id="'+id+'"]');if(!el)return;
  el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}
function gotoNode(id){
  const d=D(),n=d.nodes.find(x=>x.id===id);if(!n)return;
  const L=curLayer(),nl=nodeLayer(n,d);
  if(L!=null&&nl!==L){layerSel[dg]=nl;renderLayers();renderLegend();updateHint();}
  sel={k:"n",id};render();inspect();centerOn(n);flashNode(id);
}
function setLayer(i){layerSel[dg]=i;sel=null;render();renderLayers();renderLegend();updateHint();inspect();fitView();}
function renderLayers(){
  const el=document.getElementById("layers");if(!el)return;
  const canvasPg=currentPage==="logic"||currentPage==="screens";
  const d=canvasPg?D():null, zs=(d&&d.zones)||[];
  if(!canvasPg||!zs.length){el.style.display="none";el.innerHTML="";return;}
  el.style.display="flex";
  const L=curLayer(), cnt=i=>d.nodes.filter(n=>nodeLayer(n,d)===i).length;
  let h=`<button class="lb${L==null?" on":""}" onclick="setLayer(null)" title="Všechny vrstvy na jednom plátně">Vše <span class="c">${d.nodes.length}</span></button>`;
  zs.forEach((z,i)=>{h+=`<button class="lb${L===i?" on":""}" onclick="setLayer(${i})" style="${L===i?"color:"+z.color:""}" title="${esc(z.label)}"><span class="d" style="background:${z.color}"></span>${esc(zoneShort(z))} <span class="c">${cnt(i)}</span></button>`;});
  const mimo=cnt(-1);
  if(mimo)h+=`<button class="lb${L===-1?" on":""}" onclick="setLayer(-1)" title="Bloky, které neleží v žádné oblasti">Mimo oblasti <span class="c">${mimo}</span></button>`;
  el.innerHTML=h;
}
function updateHint(){
  const el=document.getElementById("hint");if(!el)return;
  const L=curLayer();
  if(L!=null){const z=(D().zones||[])[L];
    el.textContent=(z?zoneShort(z)+" — ":"Bloky mimo oblasti — ")+"vidíš jen tuhle vrstvu; klik na název u čárkovaného pahýlu tě přenese na navazující blok v jeho vrstvě";
    return;}
  el.textContent=dg==="screens"
    ?"Klik na popisek navigace přejde na cílovou obrazovku · klik na název oblasti otevře jen tu vrstvu · táhni z portu „→ přechod\" → navigace"
    :"Klik na popisek vazby přejde na navazující blok · klik na název oblasti otevře jen tu vrstvu · táhni z výstupního portu (vpravo) na vstupní (vlevo) → vazba";
}

function render(){
  const d=D();const nodesEl=document.getElementById("nodes");nodesEl.innerHTML="";
  visNodes(d).forEach(n=>{
    const T=TYPES[n.type];const el=document.createElement("div");const a=n.params.auto;
    el.className="node"+(sel&&sel.k==="n"&&sel.id===n.id?" sel":"")+(a==="manual"?" a-manual":a==="semi"?" a-semi":"")+(T.auto===null?" sink":"");
    el.style.left=n.x+"px";el.style.top=n.y+"px";el.dataset.id=n.id;
    let html=`<div class="hd" data-drag="${n.id}"><span class="cdot" style="background:${CAT[T.cat].color}"></span><span class="nm" title="${esc(n.name)}">${esc(n.name)}</span></div>`;
    if(T.wire){html+=`<div class="sub"><span class="mf">${esc(n.params.url||"obrazovka")}</span></div>`+wireHTML(n);}
    else{html+=`<div class="sub"><span class="mf">${esc(n.params.system||T.label)}</span>`;
      if(a)html+=`<span class="dot">·</span><span class="abadge ${a}">${AUTO_LBL[a]}</span>`;html+=`</div>`;}
    html+=`<div class="bd">`;
    const rows=nodeRows(n);
    for(let r=0;r<rows;r++){
      const inL=T.ins[r], out=T.outs[r];
      html+=`<div class="prow">`;
      if(inL!==undefined)html+=`<span class="port pin" data-port-in="${n.id}:in${r}" title="${esc(inL)}"></span><span class="plabel">${esc(inL)}</span>`;
      if(out)html+=`<span class="plabel o">${esc(out[1])}</span><span class="port pout" data-port-out="${n.id}:${out[0]}" title="${esc(out[1])}"></span>`;
      html+=`</div>`;
    }

  });
  renderEdges();updateKPI();

function edgePts(e){
  const d=D();const a=d.nodes.find(n=>n.id===e.from),b=d.nodes.find(n=>n.id===e.to);
  if(!a||!b)return null;
  const j=TYPES[a.type].outs.findIndex(o=>o[0]===e.fp);
  let i=0;if(e.tp&&e.tp.startsWith("in")&&e.tp.length>2)i=parseInt(e.tp.slice(2))||0;
  return {p1:outPort(a,j<0?0:j),p2:inPort(b,i)};
}
function pathD(p1,p2){const dx=Math.max(60,Math.abs(p2.x-p1.x)*0.45);
  return {d:`M ${p1.x} ${p1.y} C ${p1.x+dx} ${p1.y}, ${p2.x-dx} ${p2.y}, ${p2.x} ${p2.y}`,
    mid:{x:(p1.x+3*(p1.x+dx)+3*(p2.x-dx)+p2.x)/8,y:(p1.y+3*p1.y+3*p2.y+p2.y)/8}};}
function renderEdges(){
  const svg=document.getElementById("edges");
  const d=D(), L=curLayer();
  let html=`<defs>${Object.keys(EDGE_TYPES).map(t=>`<marker id="arr-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="var(--e-${t})"/></marker>`).join("")}
    <marker id="arr-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker></defs>`;
  if(showZones)(d.zones||[]).forEach((z,i)=>{if(L!=null&&i!==L)return;
    html+=`<rect class="zone" x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}" fill="${z.color}" stroke="${z.color}"></rect><text class="zlbl${L==null?" go":""}" ${L==null?`data-layer="${i}"`:""} x="${z.x+16}" y="${z.y+22}" fill="${z.color}">${esc(z.label)}${L==null?"  ›":""}</text>`;});
  const showLbl=pan().z>=0.55;
  const vis={};d.nodes.forEach(n=>{vis[n.id]=layerVisible(n,d);});
  // pahýly končí ve dvou „sloupcích rozhraní" vedle vrstvy, ať popisky neleží na jiných blocích
  const vn=d.nodes.filter(n=>vis[n.id]);
  const colR=vn.length?Math.max(...vn.map(n=>n.x+W))+70:0;
  const colL=vn.length?Math.min(...vn.map(n=>n.x))-70:0;
  const obsazeno={R:[],L:[]};
  function volnaY(strana,y){const a=obsazeno[strana];
    let yy=y;let zmena=true;
    while(zmena){zmena=false;for(const u of a){if(Math.abs(u-yy)<17){yy=u+17;zmena=true;}}}
    a.push(yy);return yy;}
  d.edges.forEach(e=>{
    const a=d.nodes.find(n=>n.id===e.from), b=d.nodes.find(n=>n.id===e.to);
    if(!a||!b)return;
    const t=e.etype||"data", isSel=sel&&sel.k==="e"&&sel.id===e.id;
    if(vis[a.id]&&vis[b.id]){
      const pt=edgePts(e);if(!pt)return;
      const {d:dd,mid}=pathD(pt.p1,pt.p2);
      html+=`<path class="edgehit" d="${dd}" data-edge="${e.id}"></path><path class="edge t-${t}${isSel?" sel":""}" d="${dd}" data-edge="${e.id}" marker-end="url(#arr-${isSel?"sel":t})"></path>`;
      if(t==="goods"||t==="money")html+=`<path class="flow" d="${dd}"></path>`;
      if(e.label&&(showLbl||isSel))html+=`<text class="elbl go${isSel?" sel":""}" data-goto="${b.id}" x="${mid.x}" y="${mid.y-6}"><title>Přejít na „${esc(b.name)}"</title>${esc(e.label)}</text>`;
      return;
    }
    if(L==null||(!vis[a.id]&&!vis[b.id]))return;   // obě strany mimo vrstvu → vazba se nekreslí
    // vazba ven z vrstvy: krátký pahýl s názvem protějšku a jeho vrstvou
    const ven=vis[a.id];
    const j=TYPES[a.type].outs.findIndex(o=>o[0]===e.fp);
    let i2=0;if(e.tp&&e.tp.startsWith("in")&&e.tp.length>2)i2=parseInt(e.tp.slice(2))||0;
    const p=ven?outPort(a,j<0?0:j):inPort(b,i2);
    const q={x:ven?colR:colL, y:volnaY(ven?"R":"L",p.y)};
    const f=ven?p:q, g=ven?q:p, mx=f.x+(g.x-f.x)*0.5;
    const path=`M ${f.x} ${f.y} C ${mx} ${f.y}, ${mx} ${g.y}, ${g.x} ${g.y}`;
    const other=ven?b:a, ol=nodeLayer(other,d), oz=(d.zones||[])[ol];
    const lbl=other.name+(oz?" · "+zoneShort(oz):"");
    html+=`<path class="edgehit" d="${path}" data-edge="${e.id}"></path>`
      +`<path class="edge stub t-${t}${isSel?" sel":""}" d="${path}" data-edge="${e.id}" marker-end="url(#arr-${isSel?"sel":t})"></path>`
      +`<circle class="stubdot" cx="${ven?q.x:q.x}" cy="${q.y}" r="3"></circle>`
      +`<text class="elbl stub go ${ven?"s":"e"}${isSel?" sel":""}" data-goto="${other.id}" x="${q.x+(ven?9:-9)}" y="${q.y+3.5}"><title>Přejít na „${esc(other.name)}"${oz?" ve vrstvě "+esc(zoneShort(oz)):""}</title>${esc((ven?"→ ":"← ")+lbl)}</text>`;
  });
  svg.innerHTML=html;
}
function updateKPI(){

const canvas=document.getElementById("canvas");
let drag=null, conn=null, panning=null, showZones=true;
function toggleZones(){showZones=!showZones;render();renderLegend();}
function toVP(ev){const r=canvas.getBoundingClientRect();const p=pan();
  return {x:(ev.clientX-r.left-p.x)/p.z,y:(ev.clientY-r.top-p.y)/p.z};}
function applyPan(){const p=pan();document.getElementById("viewport").style.transform=`translate(${p.x}px,${p.y}px) scale(${p.z})`;}
function near(el,attr){const x=el&&el.closest?el.closest("["+attr+"]"):null;return x?x.getAttribute(attr):null;}
canvas.addEventListener("mousedown",ev=>{
  const gotoId=near(ev.target,"data-goto"), zoneL=near(ev.target,"data-layer");
  if(gotoId){gotoNode(gotoId);ev.preventDefault();return;}
  if(zoneL!=null){setLayer(parseInt(zoneL,10));ev.preventDefault();return;}
  const dragId=near(ev.target,"data-drag"), outP=near(ev.target,"data-port-out"), edgeId=near(ev.target,"data-edge");
  if(outP){const [nid,port]=outP.split(":");conn={from:nid,fp:port};
    const tmp=document.createElementNS("http://www.w3.org/2000/svg","path");
    tmp.setAttribute("class","edge");tmp.setAttribute("id","tmpedge");tmp.style.pointerEvents="none";document.getElementById("edges").appendChild(tmp);
    ev.preventDefault();return;}
  if(dragId){const n=D().nodes.find(x=>x.id===dragId);const m=toVP(ev);
    drag={id:dragId,ox:m.x-n.x,oy:m.y-n.y};select("n",dragId);ev.preventDefault();return;}
  if(edgeId){select("e",edgeId);return;}
  if(ev.target===canvas||ev.target.id==="viewport"||ev.target.id==="nodes"||ev.target.id==="edges"){
    document.body.classList.remove("pal-open");
    panning={x:ev.clientX-pan().x,y:ev.clientY-pan().y};select(null);}
});
window.addEventListener("mousemove",ev=>{
  if(drag){const m=toVP(ev);const n=D().nodes.find(x=>x.id===drag.id);
    n.x=Math.round(m.x-drag.ox);n.y=Math.round(m.y-drag.oy);render();}
  else if(conn){const m=toVP(ev);const a=D().nodes.find(n=>n.id===conn.from);
    const j=TYPES[a.type].outs.findIndex(o=>o[0]===conn.fp);const p1=outPort(a,j<0?0:j);
    const tmp=document.getElementById("tmpedge");if(tmp)tmp.setAttribute("d",pathD(p1,m).d);}
  else if(panning){pan().x=ev.clientX-panning.x;pan().y=ev.clientY-panning.y;applyPan();}
});
window.addEventListener("mouseup",ev=>{
  if(conn){const tmp=document.getElementById("tmpedge");if(tmp)tmp.remove();
    const inP=near(document.elementFromPoint(ev.clientX,ev.clientY)||ev.target,"data-port-in");
    if(inP){const [nid,port]=inP.split(":");
      if(nid!==conn.from){const e=newEdge(conn.from,conn.fp,nid,port);D().edges.push(e);sel={k:"e",id:e.id};persist();}}
    conn=null;render();inspect();}
  if(drag){const n=D().nodes.find(x=>x.id===drag.id);const L=curLayer();

      drag=null;render();

  }

});
canvas.addEventListener("wheel",ev=>{ev.preventDefault();
  const r=canvas.getBoundingClientRect();const mx=ev.clientX-r.left,my=ev.clientY-r.top;const p=pan();
  const old=p.z;p.z=Math.min(2,Math.max(0.3,p.z*(ev.deltaY<0?1.1:0.9)));
  p.x=mx-(mx-p.x)*(p.z/old);p.y=my-(my-p.y)*(p.z/old);applyPan();

window.addEventListener("keydown",ev=>{

let addOff=0;

function clampToLayer(x,y){const L=curLayer();if(L==null||L<0)return {x,y};
  const z=(D().zones||[])[L];if(!z)return {x,y};
  return {x:Math.min(Math.max(x,z.x+20),Math.max(z.x+20,z.x+z.w-W-20)),
          y:Math.min(Math.max(y,z.y+40),Math.max(z.y+40,z.y+z.h-160))};}

  const n=newNode(t,Math.round(c.x),Math.round(c.y));D().nodes.push(n);select("n",n.id);persist();}
function addScreen(kind){const P=SCREEN_PRESETS.find(p=>p[0]===kind);const p=pan();const c=clampToLayer((-p.x+260)/p.z+addOff%4*30,(-p.y+120)/p.z+addOff%4*30);addOff++;

function fitView(){const d=D();const ns=visNodes(d);if(!ns.length)return;
  const L=curLayer();
  const zs=showZones?(d.zones||[]).filter((z,i)=>L==null||i===L):[];
  const okraj=L==null?0:300;   // sloupce rozhraní (pahýly vazeb ven) vedle vrstvy
  const minX=Math.min(...ns.map(n=>n.x),...zs.map(z=>z.x))-okraj,minY=Math.min(...ns.map(n=>n.y),...zs.map(z=>z.y));
  const maxX=Math.max(...ns.map(n=>n.x+W),...zs.map(z=>z.x+z.w))+okraj,maxY=Math.max(...ns.map(n=>n.y+nodeH(n)+40),...zs.map(z=>z.y+z.h));

  const p=pan();p.z=z;p.x=(r.width-(maxX-minX)*z)/2-minX*z;p.y=(r.height-(maxY-minY)*z)/2-minY*z+16;applyPan();renderEdges();}

/* ============ PROCESY & AUTOMATIZACE ============ */
let procFilter="all";
function procStats(rows){const s={now:{auto:0,semi:0,manual:0},target:{auto:0,semi:0,manual:0}};
  rows.forEach(r=>{s.now[r.now]=(s.now[r.now]||0)+1;s.target[r.target]=(s.target[r.target]||0)+1;});
  const pct=o=>rows.length?Math.round((o.auto+o.semi*0.5)/rows.length*100):0;
  return {...s,pctNow:pct(s.now),pctTarget:pct(s.target)};}
function renderProcessPage(){
  const el=document.getElementById("pgProcess");
  const rows=procFilter==="all"?state.process:state.process.filter(r=>r.flow===procFilter);
  const st=procStats(state.process);
  const bar=o=>`<div class="bar"><i style="width:${o.auto/state.process.length*100}%;background:var(--acc)"></i><i style="width:${o.semi/state.process.length*100}%;background:var(--warn)"></i><i style="width:${o.manual/state.process.length*100}%;background:var(--bad)"></i></div>`;
  let h=`<div class="pgHead"><div><h2>Procesy &amp; automatizace</h2><div class="sub">Každý krok, kde dnes pracuje člověk, a jak ho v novém e-shopu odbouráme. Tabulku můžeš upravovat.</div></div>
    <div class="ctrls"><button class="btn" onclick="addProcRow()">＋ Přidat krok</button><button class="btn" onclick="exportProcCSV()">Export CSV</button></div></div>`;
  h+=`<div class="sumBar">
    <div class="sumBox"><b style="color:var(--bad)">${st.pctNow} %</b><span>automatizace dnes</span>${bar(st.now)}</div>
    <div class="sumBox"><b style="color:var(--acc)">${st.pctTarget} %</b><span>automatizace cíl</span>${bar(st.target)}</div>
    <div class="sumBox"><b>${st.now.manual} → ${st.target.manual}</b><span>ručních kroků dnes → cíl</span></div>
    <div class="sumBox"><b>${st.now.semi} → ${st.target.semi}</b><span>polo-automatických dnes → cíl</span></div>
    <div class="sumBox"><b>${state.process.length}</b><span>kroků celkem</span></div></div>`;
  h+=`<div class="flowTabs"><button class="${procFilter==='all'?'on':''}" onclick="procFilter='all';renderProcessPage()">Vše (${state.process.length})</button>`;
  Object.keys(FLOW_LBL).forEach(f=>{h+=`<button class="${procFilter===f?'on':''}" onclick="procFilter='${f}';renderProcessPage()">${FLOW_LBL[f]} (${state.process.filter(r=>r.flow===f).length})</button>`;});
  h+=`</div>`;
  const sel_=(r,k)=>`<select class="${r[k]}" onchange="updProc('${r.id}','${k}',this.value)"><option value="auto" ${r[k]==='auto'?'selected':''}>⚙ auto</option><option value="semi" ${r[k]==='semi'?'selected':''}>◐ polo</option><option value="manual" ${r[k]==='manual'?'selected':''}>✋ ručně</option></select>`;
  h+=`<div style="overflow:auto"><table class="proc"><thead><tr><th>#</th><th>Tok</th><th style="min-width:260px">Krok procesu</th><th>Dnes</th><th>Cíl</th><th style="min-width:260px">Nástroj / integrace</th><th style="min-width:150px">Spouštěč</th><th></th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{h+=`<tr><td class="num">${i+1}</td>
    <td><select onchange="updProc('${r.id}','flow',this.value)">${Object.keys(FLOW_LBL).map(f=>`<option value="${f}" ${r.flow===f?'selected':''}>${FLOW_LBL[f]}</option>`).join("")}</select></td>
    <td><input value="${esc(r.step)}" oninput="updProc('${r.id}','step',this.value,true)"></td>
    <td>${sel_(r,'now')}</td><td>${sel_(r,'target')}</td>
    <td><input value="${esc(r.tool)}" oninput="updProc('${r.id}','tool',this.value,true)"></td>
    <td><input value="${esc(r.trigger)}" oninput="updProc('${r.id}','trigger',this.value,true)"></td>
    <td><button class="del" onclick="delProc('${r.id}')">×</button></td></tr>`;});
  h+=`</tbody></table></div>`;
  el.innerHTML=h;updateKPI();
}
function updProc(id,k,v,quiet){const r=state.process.find(x=>x.id===id);if(!r)return;r[k]=v;persist();if(!quiet)renderProcessPage();}
function addProcRow(){state.process.push({id:"p"+(uid++),flow:procFilter==="all"?"common":procFilter,step:"Nový krok",now:"manual",target:"auto",tool:"",trigger:""});persist();renderProcessPage();}
function delProc(id){state.process=state.process.filter(x=>x.id!==id);persist();renderProcessPage();}
function exportProcCSV(){const rows=[["Tok","Krok","Dnes","Cíl","Nástroj","Spouštěč"]].concat(state.process.map(r=>[FLOW_LBL[r.flow],r.step,r.now,r.target,r.tool,r.trigger]));
  const csv="﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
  downloadFile("eshop_procesy.csv",csv,"text/csv");}

      <b>Vše</b> vrátí kompletní plátno. Vrstva bloku se bere podle toho, ve které oblasti leží jeho střed, takže platí i pro bloky, které si přidáš sám.</div>
    <div class="helpBox"><h3>🏛 Helios = jádro modelu</h3>Uprostřed plátna stojí <b>Helios (ERP)</b> a prochází jím všechno podstatné.

  </div>`;

/* ============ KONTROLA MODELU ============ */
function autoLayoutCheck(){
  const d=D();const issues=[];
  d.nodes.forEach(n=>{const T=TYPES[n.type];const ins=d.edges.filter(e=>e.to===n.id).length,outs=d.edges.filter(e=>e.from===n.id).length;
    if(T.ins.length&&!ins&&T.auto!==null&&n.type!=="customer")issues.push(`„${n.name}“ nemá žádný vstup`);
    if(T.outs.length&&!outs&&T.auto!==null)issues.push(`„${n.name}“ nemá žádný výstup`);
    if(n.params.auto==="manual")issues.push(`„${n.name}“ je ruční krok — navrhni automatizaci`);});
  if(dg==="logic")d.edges.forEach(e=>{if(!e.label)issues.push("vazba bez popisku ("+e.id+")");});
  if(!issues.length){toast("✔ Model je kompletní: každý blok je zapojený, žádný ruční krok.");return;}
  alert("Kontrola modelu — "+issues.length+" nálezů:\n\n• "+issues.slice(0,25).join("\n• ")+(issues.length>25?"\n…":""));
}

/* ============ PERSISTENCE ============ */
const STORAGE_KEY="eshop_model_v1";
let persistT=null;
function persist(){clearTimeout(persistT);if(!dirty){dirty=true;renderCloudChip();}
  persistT=setTimeout(()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify({state,pans,uid,cloud,dirty}));}catch(e){}updateKPI();},150);}
function restore(){try{const s=localStorage.getItem(STORAGE_KEY);if(!s)return false;const d=JSON.parse(s);
  if(!d.state||!d.state.diagrams)return false;state=d.state;pans=d.pans||pans;uid=d.uid||9999;cloud=d.cloud||null;dirty=!!d.dirty;migrate();return true;}catch(e){return false;}}
function migrate(){["logic","screens"].forEach(k=>{const d=state.diagrams[k];if(!d.zones){const def=k==="logic"?buildDefaultLogic().zones:buildDefaultScreens().zones;d.zones=def;}});}
// Uložení souboru: v prohlížeči artefaktů claude.ai přes schopnost „downloads“, jinde klasické stažení
async function downloadFile(name,data,mime){
  try{if(window.claude&&typeof window.claude.use==="function"){const dl=await window.claude.use("downloads");
    if(dl){await dl.save({filename:name,data});toast("Soubor „"+name+"“ uložen.");return;}}}
  catch(e){if(e&&e.code==="declined")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;a.click();}
function saveProj(){downloadFile("eshop_model.json",JSON.stringify({state,pans,uid},null,1),"application/json");}
function loadProj(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.state||!d.state.diagrams)throw 0;state=d.state;pans=d.pans||pans;uid=d.uid||9999;migrate();sel=null;render();inspect();persist();toast("Model načten.");}catch(e){alert("Chyba souboru.");}};r.readAsText(f);}
function resetDefault(){if(!confirm("Obnovit výchozí navržený model? Tvoje úpravy se přepíší."))return;buildDefault();sel=null;layerSel={logic:null,screens:null};setPage(currentPage==="help"?"logic":currentPage);fitView();persist();toast("Výchozí model obnoven.");}
function clearCanvas(){if(!confirm("Vyčistit aktuální plátno ("+(dg==="logic"?"logika":"obrazovky")+")?"))return;D().nodes=[];D().edges=[];sel=null;render();inspect();persist();}

let cloud=null;      // {id,name,updatedAt} — na který sdílený model je plátno napojené
let dirty=false;     // neuložené změny oproti sdílené verzi
let ME=null;         // {sso, employee:{email,name}} z /api/me; null = server nedostupný
function fmtDate(iso){if(!iso)return "";const d=new Date(iso);return d.toLocaleDateString("cs-CZ")+" "+d.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});}
function authorName(){return (ME&&ME.employee&&(ME.employee.name||ME.employee.email))||state.meta.author||"";}
async function api(path,opt){const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"},cache:"no-store"},opt||{}));
  if(r.status===401)throw new Error("Nepřihlášeno — otevři aplikaci přes intranet.");return r;}
async function initCloud(){if(location.protocol==="file:"){ME=null;renderCloudChip();return;}
  try{const r=await fetch("/api/me",{cache:"no-store"});if(r.ok){ME=await r.json();if(ME.employee&&!state.meta.author){state.meta.author=ME.employee.name||ME.employee.email;}}}catch(e){ME=null;}renderCloudChip();}
function renderCloudChip(){const el=document.getElementById("cloudChip");if(!el)return;
  const who=ME&&ME.employee?`<span style="color:var(--tx3)">👤 ${esc(ME.employee.name||ME.employee.email)}</span><span style="color:var(--line2)">·</span>`:"";
  if(!ME){el.innerHTML=`<span class="st off">☁ offline</span><span>jen v tomto prohlížeči</span>`;return;}
  if(!cloud){el.innerHTML=`${who}<span class="st off">☁</span><span>nesdíleno — klikni pro sdílení</span>`;return;}
  el.innerHTML=`${who}<span class="st ${dirty?'dirty':'ok'}">${dirty?'● neuloženo':'✓ uloženo'}</span><span title="${esc(cloud.name)}">${esc(cloud.name)}</span>`;}
async function openShared(){const box=document.getElementById("sharedBody");document.getElementById("modalShared").classList.add("show");
  box.innerHTML=`<div class="mhead"><h3>☁ Sdílené modely</h3><button class="x" onclick="closeShared()">×</button></div><div class="msub">Načítám…</div>`;
  let list=[];try{const r=await api("/api/shared-list");list=(await r.json()).projects||[];}
  catch(e){box.innerHTML=`<div class="mhead"><h3>☁ Sdílené modely</h3><button class="x" onclick="closeShared()">×</button></div>
    <div class="msub">Sdílení vyžaduje běžící server (nasazení na Railway / intranet). Zde běží aplikace jen lokálně — použij <b>Uložit JSON</b> a pošli soubor kolegům.<br><span style="color:var(--bad)">${esc(e.message)}</span></div>`;return;}
  let h=`<div class="mhead"><h3>☁ Sdílené modely</h3><button class="x" onclick="closeShared()">×</button></div>
    <div class="msub">Model uložený na server vidí a může upravovat každý kolega s přístupem. Otevři ho, uprav a ulož změny — kdo uloží později, přepíše dřívější verzi (aplikace tě upozorní, pokud mezitím někdo jiný uložil).</div>`;
  if(cloud){h+=`<div class="card"><b>Aktuálně napojeno:</b> ${esc(cloud.name)} <span style="color:var(--tx3)">· poslední uložení ${fmtDate(cloud.updatedAt)}</span>
    <div class="irow" style="margin-top:8px"><button class="btn run" onclick="saveCloud(false)">${dirty?'Uložit změny':'Uložit (beze změn)'}</button><button class="btn" onclick="copyCloudLink()">Kopírovat odkaz</button><button class="btn" onclick="detachCloud()">Odpojit</button></div></div>`;}
  h+=`<div class="mform"><input class="in" id="newSharedName" placeholder="Název nového sdíleného modelu" value="${esc(cloud?cloud.name+' (kopie)':state.meta.name)}"><button class="btn" onclick="saveCloud(true)">＋ Uložit aktuální plátno jako nový</button></div>`;
  h+=`<div class="isub" style="margin-top:16px">Na serveru (${list.length})</div>`;
  if(!list.length)h+=`<div class="msub">Zatím žádný sdílený model. Ulož aktuální plátno tlačítkem výše.</div>`;
  list.forEach(m=>{const cur=cloud&&cloud.id===m.id;
    h+=`<div class="mrow ${cur?'cur':''}"><div><b>${esc(m.name)}</b>${cur?' <span class="abadge auto">otevřeno</span>':''}<small>${m.nodeCount} bloků · ${m.edgeCount} vazeb · založil ${esc(m.author)} · naposledy ${esc(m.updatedBy||m.author)} ${fmtDate(m.updatedAt)}</small></div>
      <div class="acts"><button class="btn" onclick="openCloud('${m.id}')">Otevřít</button><button class="btn danger" onclick="deleteCloud('${m.id}','${esc(m.name).replace(/'/g,"&#39;")}')">Smazat</button></div></div>`;});
  box.innerHTML=h;}
function closeShared(){document.getElementById("modalShared").classList.remove("show");}
async function openCloud(id){if(dirty&&cloud&&cloud.id!==id&&!confirm("Máš neuložené změny. Otevřít jiný model a zahodit je?"))return;
  if(await loadShared(id)){closeShared();sel=null;setPage(currentPage==="help"?"logic":currentPage);persistQuiet();toast("Otevřen sdílený model „"+cloud.name+"“.");}else alert("Model se nepodařilo načíst.");}
async function loadShared(id){try{const r=await api("/api/share/"+id);if(!r.ok)return false;const p=await r.json();
  if(p.metadata&&p.metadata.state){state=p.metadata.state;pans=p.metadata.pans||pans;uid=p.metadata.uid||9999;migrate();
    cloud={id:p.id||id,name:p.name,updatedAt:p.updatedAt||p.createdAt};dirty=false;state.meta.name=p.name;renderCloudChip();return true;}}catch(e){}return false;}
async function saveCloud(asNew,force){
  let name=cloud&&!asNew?cloud.name:(document.getElementById("newSharedName")||{}).value||state.meta.name;
  if(asNew){name=(name||"").trim();if(!name){alert("Zadej název modelu.");return;}}
  const body={name,author:authorName(),nodes:D().nodes,edges:D().edges,metadata:{state,pans,uid}};
  if(!asNew&&cloud&&!force)body.baseUpdatedAt=cloud.updatedAt;
  try{const r=await api(asNew||!cloud?"/api/share":"/api/share/"+cloud.id,{method:asNew||!cloud?"POST":"PUT",body:JSON.stringify(body)});
    if(r.status===409){const j=await r.json();
      if(confirm(j.error+"\n\nOK = přepsat jejich verzi mou\nZrušit = načíst jejich verzi (mé změny se zahodí)"))return saveCloud(false,true);
      await loadShared(cloud.id);sel=null;setPage(currentPage==="help"?"logic":currentPage);persistQuiet();closeShared();return;}
    if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
    cloud={id:j.id,name:j.name||name,updatedAt:j.updatedAt};dirty=false;state.meta.name=cloud.name;renderCloudChip();persistQuiet();
    toast("Uloženo na server: „"+cloud.name+"“.");if(document.getElementById("modalShared").classList.contains("show"))openShared();
  }catch(e){alert("Uložení selhalo: "+e.message);}}
async function deleteCloud(id,name){if(!confirm("Smazat sdílený model „"+name+"“ pro všechny?"))return;
  try{await api("/api/share/"+id,{method:"DELETE"});if(cloud&&cloud.id===id){cloud=null;dirty=true;renderCloudChip();persistQuiet();}openShared();}catch(e){alert(e.message);}}
function detachCloud(){cloud=null;dirty=true;renderCloudChip();persistQuiet();openShared();}
async function copyCloudLink(){if(!cloud)return;const url=location.origin+location.pathname+"?shared="+cloud.id;try{await navigator.clipboard.writeText(url);toast("Odkaz zkopírován.");}catch(e){prompt("Odkaz:",url);}}
function persistQuiet(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({state,pans,uid,cloud,dirty}));}catch(e){}updateKPI();}
window.addEventListener("keydown",ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="s"){ev.preventDefault();if(cloud)saveCloud(false);else openShared();}});
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600);}

/* ============ START ============ */
(async function(){
  const sharedId=new URLSearchParams(location.search).get("shared");
  await initCloud();
  let ok=false;
  if(sharedId){ok=await loadShared(sharedId);if(ok){try{history.replaceState(null,"",location.pathname);}catch(e){}}}
  let cerstvy=false;
  if(!ok&&!restore()){buildDefault();cerstvy=true;}
  if(ok)persistQuiet();
  // výchozí stav = panely schované (model se čte přes celou plochu); kdo si je vrátí, tomu to zůstane
  try{panelsOff=localStorage.getItem("em_panels")!=="0";}catch(e){panelsOff=true;}
  applyPanels();
  setPage("logic");renderCloudChip();renderLayers();updateHint();
  // u čerstvého modelu srovnej pohled na celé plátno (model je široký — vlevo e-shop, uprostřed Helios, vpravo zboží)
  if(cerstvy)requestAnimationFrame(()=>fitView());
})();
</script>
</body>
</html>
